<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>አለማየሁ እቁብ | Modern Equb</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,"Noto Sans Ethiopic",sans-serif;
 background:#061510;
 color:#fff;
}
header{
 background:linear-gradient(135deg,#073b2a,#0b6b4b);
 padding:22px 15px;
 text-align:center;
 border-bottom:2px solid #d5a63a;
}
header h1{margin:0;color:#ffd66b}
header p{margin:8px 0 0;color:#ddd}

.container{
 max-width:1100px;
 margin:auto;
 padding:20px;
}

.card{
 background:#0b241b;
 border:1px solid #174c37;
 border-radius:16px;
 padding:20px;
 margin-bottom:20px;
 box-shadow:0 8px 25px #0005;
}

h2{color:#ffd66b}

input,select,button,textarea{
 width:100%;
 padding:13px;
 margin:6px 0;
 border-radius:10px;
 border:1px solid #376c56;
 background:#071b14;
 color:#fff;
 font-size:16px;
}

button{
 background:#d5a63a;
 color:#111;
 font-weight:bold;
 cursor:pointer;
 border:0;
}
button:hover{filter:brightness(1.1)}

.secondary{background:#18553e;color:#fff}
.danger{background:#a83232;color:#fff}

.hidden{display:none}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
 gap:15px;
}

.member{
 background:#102e23;
 padding:15px;
 border-radius:12px;
 border-left:4px solid #d5a63a;
}

.paid{color:#57e389}
.unpaid{color:#ff7777}

.notice{
 background:#122f23;
 padding:15px;
 border-radius:12px;
 margin:10px 0;
}

#loginPage{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.loginBox{
 width:100%;
 max-width:420px;
}

.drawBox{
 text-align:center;
 padding:30px 15px;
 background:radial-gradient(circle,#123d2c,#071b14);
 border:2px solid #d5a63a;
 border-radius:20px;
}

.drawTitle{
 font-size:20px;
 color:#ffd66b;
}

.drawName{
 font-size:42px;
 font-weight:bold;
 color:#fff;
 min-height:65px;
 margin:20px 0;
}

.winner{
 font-size:30px;
 color:#57e389;
 font-weight:bold;
}

table{
 width:100%;
 border-collapse:collapse;
 margin-top:15px;
}
th,td{
 padding:10px;
 border-bottom:1px solid #285542;
 text-align:left;
}

.small{font-size:13px;color:#aaa}

@media(max-width:600px){
 .drawName{font-size:30px}
 .container{padding:12px}
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginPage">
 <div class="card loginBox">
  <h1 style="text-align:center;color:#ffd66b">አለማየሁ እቁብ</h1>
  <p style="text-align:center">Admin Login</p>

  <input id="loginEmail" type="email" placeholder="Admin Email">
  <input id="loginPassword" type="password" placeholder="Password">

  <button onclick="loginAdmin()">🔐 Admin Login</button>

  <p id="loginMsg" style="text-align:center;color:#ff7777"></p>
 </div>
</section>


<!-- APP -->
<div id="app" class="hidden">

<header>
 <h1>አለማየሁ እቁብ</h1>
 <p>ዘመናዊ የእቁብ አስተዳደር</p>
</header>

<div class="container">

<!-- TOP -->
<div class="card">
 <div class="grid">
  <div>
   <b>የሳምንት ክፍያ</b>
   <h2>10,000 ብር</h2>
  </div>

  <div>
   <b>የእቁብ ጊዜ</b>
   <h2>15 ሳምንት</h2>
  </div>

  <div>
   <b>የአሸናፊ ገንዘብ</b>
   <h2>150,000 ብር*</h2>
  </div>
 </div>

 <p class="small">
 * 150,000 ብር ለማግኘት 15 አባላት በሳምንቱ 10,000 ብር መክፈል አለባቸው።
 </p>

 <button class="danger" onclick="logout()">Logout</button>
</div>


<!-- NOTICE -->
<div class="card">
 <h2>📢 ማስታወቂያ</h2>

 <textarea id="noticeText"
 placeholder="ማስታወቂያ ይጻፉ..."></textarea>

 <button onclick="addNotice()">ማስታወቂያ አስገባ</button>

 <div id="notices"></div>
</div>


<!-- MEMBERS -->
<div class="card">
 <h2>👥 አባላት</h2>

 <div class="grid">
  <input id="memberName" placeholder="የአባል ስም">
  <button onclick="addMember()">➕ አባል ጨምር</button>
 </div>

 <div id="membersList" class="grid"></div>
</div>


<!-- PAYMENTS -->
<div class="card">
 <h2>💰 የሳምንት ክፍያ</h2>

 <select id="paymentMember"></select>

 <select id="paymentWeek">
  <option value="1">ሳምንት 1</option>
  <option value="2">ሳምንት 2</option>
  <option value="3">ሳምንት 3</option>
  <option value="4">ሳምንት 4</option>
  <option value="5">ሳምንት 5</option>
  <option value="6">ሳምንት 6</option>
  <option value="7">ሳምንት 7</option>
  <option value="8">ሳምንት 8</option>
  <option value="9">ሳምንት 9</option>
  <option value="10">ሳምንት 10</option>
  <option value="11">ሳምንት 11</option>
  <option value="12">ሳምንት 12</option>
  <option value="13">ሳምንት 13</option>
  <option value="14">ሳምንት 14</option>
  <option value="15">ሳምንት 15</option>
 </select>

 <button onclick="recordPayment()">💵 10,000 ብር ክፍያ መዝግብ</button>

 <div id="paymentsList"></div>
</div>


<!-- DRAW -->
<div class="card">
 <h2>🎰 የእጣ አወጣጥ</h2>

 <select id="drawWeek">
  <option value="1">ሳምንት 1</option>
  <option value="2">ሳምንት 2</option>
  <option value="3">ሳምንት 3</option>
  <option value="4">ሳምንት 4</option>
  <option value="5">ሳምንት 5</option>
  <option value="6">ሳምንት 6</option>
  <option value="7">ሳምንት 7</option>
  <option value="8">ሳምንት 8</option>
  <option value="9">ሳምንት 9</option>
  <option value="10">ሳምንት 10</option>
  <option value="11">ሳምንት 11</option>
  <option value="12">ሳምንት 12</option>
  <option value="13">ሳምንት 13</option>
  <option value="14">ሳምንት 14</option>
  <option value="15">ሳምንት 15</option>
 </select>

 <div class="drawBox">

  <div class="drawTitle">የዚህ ሳምንት እጣ</div>

  <div id="drawName" class="drawName">
   እጣ ለማውጣት ዝግጁ
  </div>

  <div id="winner" class="winner"></div>

  <p id="potAmount">የእጣ ገንዘብ: 0 ብር</p>

  <button onclick="runDraw()">
   🎰 እጣ አውጣ
  </button>

 </div>

 <h3>📜 የእጣ ታሪክ</h3>
 <div id="drawHistory"></div>
</div>

</div>
</div>


<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getAuth,
 signInWithEmailAndPassword,
 onAuthStateChanged,
 signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
 getDatabase,
 ref,
 set,
 push,
 get,
 onValue,
 update
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* FIREBASE CONFIG */

const firebaseConfig = {
 apiKey: "AIzaSyCrw9iYsLyW-5QNLw8dQtX0bHUFb-RZfyA",
 authDomain: "alemayehu-equb.firebaseapp.com",
 databaseURL: "https://alemayehu-equb-c3d70-default-rtdb.firebaseio.com",
 projectId: "alemayehu-equb",
 storageBucket: "alemayehu-equb.firebasestorage.app",
 messagingSenderId: "901654220346",
 appId: "1:901654220346:web:f1185006a2279069cf2f03",
 measurementId: "G-MER8XPCEQF"
};


/* IMPORTANT:
   Replace this with your NEW Firebase Admin UID.
*/

const ADMIN_UID = "YOUR_ADMIN_UID";


const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);
const db = getDatabase(appFirebase);


/* INITIAL MEMBERS */

const initialMembers = [
 "አለማየሁ",
 "ፍሬ",
 "ቃላአብ",
 "ሞገስ",
 "ፌቨን",
 "አየናቸው",
 "ባጃ",
 "አቤል",
 "መልኮሙ",
 "ቃል"
];


/* LOGIN */

window.loginAdmin = async function(){

 const email =
 document.getElementById("loginEmail").value.trim();

 const password =
 document.getElementById("loginPassword").value;

 const msg =
 document.getElementById("loginMsg");

 if(!email || !password){
  msg.textContent="Email እና Password ያስገቡ";
  return;
 }

 try{

  await signInWithEmailAndPassword(
   auth,
   email,
   password
  );

 }catch(error){

  console.error(error);

  msg.textContent =
   "Login failed: " + error.message;

 }

};


/* AUTH */

onAuthStateChanged(auth, async user=>{

 if(user && user.uid === ADMIN_UID){

  document.getElementById("loginPage")
   .classList.add("hidden");

  document.getElementById("app")
   .classList.remove("hidden");

  await seedMembers();

  loadMembers();
  loadPayments();
  loadNotices();
  loadDrawHistory();

 }else{

  document.getElementById("loginPage")
   .classList.remove("hidden");

  document.getElementById("app")
   .classList.add("hidden");

 }

});


/* LOGOUT */

window.logout = async function(){

 await signOut(auth);

};


/* SEED INITIAL MEMBERS */

async function seedMembers(){

 const membersRef = ref(db,"members");

 const snapshot = await get(membersRef);

 if(snapshot.exists()) return;

 const data = {};

 initialMembers.forEach((name,index)=>{

  const id = "member_" + (index+1);

  data[id] = {
   name:name,
   createdAt:Date.now()
  };

 });

 await set(membersRef,data);

}


/* MEMBERS */

function loadMembers(){

 onValue(ref(db,"members"),snapshot=>{

  const list =
   document.getElementById("membersList");

  const select =
   document.getElementById("paymentMember");

  list.innerHTML="";
  select.innerHTML="";

  if(!snapshot.exists()){

   list.innerHTML =
    "<p>አባል የለም</p>";

   return;
  }

  snapshot.forEach(child=>{

   const member = child.val();

   const div =
    document.createElement("div");

   div.className="member";

   div.innerHTML=`
    <strong>${escapeHTML(member.name)}</strong>
   `;

   list.appendChild(div);

   const option =
    document.createElement("option");

   option.value=child.key;
   option.textContent=member.name;

   select.appendChild(option);

  });

 });

}


/* ADD MEMBER */

window.addMember = async function(){

 const input =
  document.getElementById("memberName");

 const name=input.value.trim();

 if(!name){
  alert("የአባል ስም ያስገቡ");
  return;
 }

 const newRef =
  push(ref(db,"members"));

 await set(newRef,{
  name:name,
  createdAt:Date.now()
 });

 input.value="";

 alert("አባሉ ተጨምሯል");

};


/* PAYMENT */

window.recordPayment = async function(){

 const memberId =
  document.getElementById("paymentMember").value;

 const week =
  Number(document.getElementById("paymentWeek").value);

 if(!memberId){
  alert("አባል ይምረጡ");
  return;
 }

 const paymentId =
  memberId + "_week_" + week;

 const paymentRef =
  ref(db,"payments/"+paymentId);

 const exists =
  await get(paymentRef);

 if(exists.exists()){

  alert("ይህ አባል ለዚህ ሳምንት ከፍሏል።");
  return;
 }

 await set(paymentRef,{
  memberId:memberId,
  week:week,
  amount:10000,
  paidAt:Date.now()
 });

 alert("ክፍያው ተመዝግቧል");

};


/* PAYMENTS */

function loadPayments(){

 onValue(ref(db,"payments"),async snapshot=>{

  const box =
   document.getElementById("paymentsList");

  box.innerHTML="";

  if(!snapshot.exists()){

   box.innerHTML="<p>ክፍያ የለም</p>";
   return;

  }

  const membersSnap =
   await get(ref(db,"members"));

  const members =
   membersSnap.val() || {};

  const table =
   document.createElement("table");

  table.innerHTML=`
   <tr>
    <th>አባል</th>
    <th>ሳምንት</th>
    <th>መጠን</th>
    <th>ሁኔታ</th>
   </tr>
  `;

  snapshot.forEach(child=>{

   const p=child.val();

   const tr =
    document.createElement("tr");

   tr.innerHTML=`
    <td>${escapeHTML(
     members[p.memberId]?.name || "Unknown"
    )}</td>

    <td>Week ${p.week}</td>

    <td>${p.amount.toLocaleString()} ብር</td>

    <td class="paid">✓ ተከፍሏል</td>
   `;

   table.appendChild(tr);

  });

  box.appendChild(table);

 });

}


/* NOTICE */

window.addNotice = async function(){

 const input =
  document.getElementById("noticeText");

 const text=input.value.trim();

 if(!text){
  alert("ማስታወቂያ ያስገቡ");
  return;
 }

 const newRef =
  push(ref(db,"notices"));

 await set(newRef,{
  text:text,
  createdAt:Date.now()
 });

 input.value="";

};


/* NOTICES */

function loadNotices(){

 onValue(ref(db,"notices"),snapshot=>{

  const box =
   document.getElementById("notices");

  box.innerHTML="";

  snapshot.forEach(child=>{

   const n=child.val();

   const div =
    document.createElement("div");

   div.className="notice";

   div.innerHTML=
    escapeHTML(n.text);

   box.prepend(div);

  });

 });

}


/* DRAW */

window.runDraw = async function(){

 const week =
  Number(document.getElementById("drawWeek").value);

 const drawRef =
  ref(db,"draws/week_"+week);

 const old =
  await get(drawRef);

 if(old.exists()){

  const oldData=old.val();

  document.getElementById("winner").textContent =
   "🏆 አሸናፊ: " + oldData.winnerName;

  document.getElementById("potAmount").textContent =
   "የእጣ ገንዘብ: " +
   oldData.pot.toLocaleString() +
   " ብር";

  alert("የዚህ ሳምንት እጣ ቀድሞ ወጥቷል።");

  return;
 }


 const [membersSnap,paymentsSnap] =
  await Promise.all([
   get(ref(db,"members")),
   get(ref(db,"payments"))
  ]);


 const members =
  membersSnap.val() || {};

 const payments =
  paymentsSnap.val() || {};


 const eligible=[];

 Object.values(payments).forEach(payment=>{

  if(
   Number(payment.week) === week &&
   members[payment.memberId]
  ){

   if(
    !eligible.find(
     x=>x.id===payment.memberId
    )
   ){

    eligible.push({
     id:payment.memberId,
     name:members[payment.memberId].name
    });

   }

  }

 });


 if(eligible.length===0){

  alert(
   "ይህን ሳምንት የከፈለ አባል የለም።"
  );

  return;
 }


 const pot =
  eligible.length * 10000;


 const drawName =
  document.getElementById("drawName");

 const winner =
  document.getElementById("winner");


 winner.textContent="";

 drawName.textContent="🎰 እየወጣ ነው...";


 /* ANIMATION */

 let counter=0;

 const animation =
  setInterval(()=>{

   const random =
    eligible[
     Math.floor(
      Math.random()*eligible.length
     )
    ];

   drawName.textContent =
    random.name;

   counter++;

   if(counter>=20){

    clearInterval(animation);

    const selected =
     eligible[
      Math.floor(
       Math.random()*eligible.length
      )
     ];


    drawName.textContent =
     "🎉 " + selected.name;

    winner.textContent =
     "🏆 አሸናፊ: " +
     selected.name;


    document.getElementById(
     "potAmount"
    ).textContent =
     "የእጣ ገንዘብ: " +
     pot.toLocaleString() +
     " ብር";


    saveDraw(
     week,
     selected,
     eligible,
     pot
    );

   }

  },120);

};


/* SAVE DRAW */

async function saveDraw(
 week,
 selected,
 eligible,
 pot
){

 await set(
  ref(db,"draws/week_"+week),
  {
   week:week,
   winnerId:selected.id,
   winnerName:selected.name,
   pot:pot,
   participants:eligible.length,
   createdAt:Date.now()
  }
 );

 alert(
  "🎉 እጣው ወጥቷል!\n\n" +
  "🏆 " + selected.name +
  "\n💰 " + pot.toLocaleString() +
  " ብር"
 );

 loadDrawHistory();

}


/* DRAW HISTORY */

function loadDrawHistory(){

 onValue(ref(db,"draws"),snapshot=>{

  const box =
   document.getElementById("drawHistory");

  box.innerHTML="";

  if(!snapshot.exists()){

   box.innerHTML=
    "<p>እስካሁን እጣ አልወጣም።</p>";

   return;
  }

  const table =
   document.createElement("table");

  table.innerHTML=`
   <tr>
    <th>ሳምንት</th>
    <th>አሸናፊ</th>
    <th>ተሳታፊ</th>
    <th>ገንዘብ</th>
   </tr>
  `;

  snapshot.forEach(child=>{

   const d=child.val();

   const tr =
    document.createElement("tr");

   tr.innerHTML=`
    <td>${d.week}</td>
    <td class="winner">${escapeHTML(d.winnerName)}</td>
    <td>${d.participants}</td>
    <td>${d.pot.toLocaleString()} ብር</td>
   `;

   table.appendChild(tr);

  });

  box.appendChild(table);

 });

}


/* SECURITY HTML ESCAPE */

function escapeHTML(value){

 return String(value)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}

</script>

</body>
</html>
